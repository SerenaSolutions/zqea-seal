name: 'Z-QEA Receipt Sealer'
description: 'Seal JSON artifacts with SHA3-256 + ML-DSA-44 post-quantum signatures and quantum-attested entropy.'
author: 'Serena Quantum Solutions'
branding:
  icon: 'lock'
  color: 'blue'
inputs:
  file:
    description: 'JSON file to seal'
    required: true
  output:
    description: 'sealed output path (default: <file>.sealed.json)'
    required: false
runs:
  using: 'composite'
  steps:
    - name: 'Install post-quantum core (ML-DSA-44)'
      shell: bash
      run: pip install --quiet pqcrypto
    - name: 'Seal JSON artifact'
      shell: bash
      run: |
        python3 "${{ github.action_path }}/zqea_seal.py" "${{ inputs.file }}" ${{ inputs.output && format('-o {0}', inputs.output) || '' }}
